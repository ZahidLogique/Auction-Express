name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Run baru di branch/PR yang sama membatalkan run lama yang masih jalan
concurrency:
  group: playwright-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Batas total job. Run sehat ±8 menit E2E + ±4 menit setup (install, browser)
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create .env from secrets
        run: |
          cat << ENVEOF > .env
          BASE_URL=${{ secrets.BACKOFFICE_URL }}
          APP_USERNAME=${{ secrets.ADMIN_USER }}
          APP_PASSWORD=${{ secrets.ADMIN_PASS }}
          BACKOFFICE_URL=${{ secrets.BACKOFFICE_URL }}
          ADMIN_USER=${{ secrets.ADMIN_USER }}
          ADMIN_PASS=${{ secrets.ADMIN_PASS }}
          FE_AUCTION_URL=${{ secrets.FE_AUCTION_URL }}
          AUCTION_USER=${{ secrets.AUCTION_USER }}
          AUCTION_PASS=${{ secrets.AUCTION_PASS }}
          FE_CONDUCTOR_URL=${{ secrets.FE_CONDUCTOR_URL }}
          CONDUCTOR_USER=${{ secrets.CONDUCTOR_USER }}
          CONDUCTOR_PASS=${{ secrets.CONDUCTOR_PASS }}
          TEST_SEQUENTIAL=true
          ENVEOF

      - name: Generate BDD feature specs
        run: npx bddgen

      - name: Run E2E tests
        # Dihentikan paksa kalau lewat batas; step upload di bawah tetap jalan (if: always())
        timeout-minutes: 15
        run: npx playwright test --project=e2e
        env:
          PLAYWRIGHT_HEADLESS: true
          # Lewati screenshot per-step (hanya screenshot saat gagal) supaya report kecil & upload cepat
          STEP_SCREENSHOTS: false

      # Dashboard Allure dalam satu file HTML (bisa diunduh lalu dibuka langsung).
      # env & categories ditulis SETELAH test karena global-setup mengosongkan allure-results saat run mulai.
      - name: Generate Allure report (single file)
        if: always()
        run: |
          node scripts/allure-env.js
          node scripts/allure-categories.js
          npx allure generate allure-results --clean --single-file -o allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7
